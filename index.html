<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cattle Insurance Policy Verification</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#222}.wrap{max-width:700px;margin:60px auto;padding:20px}.card{background:white;padding:32px;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:14px;margin-top:10px;border-radius:9px;font-size:16px;box-sizing:border-box}input{border:1px solid #ccd}button{border:0;background:#166534;color:white;font-weight:bold;cursor:pointer}.admin{display:block;text-align:center;margin-top:20px;color:#475467}
</style></head><body><div class="wrap"><div class="card">
<h1>Cattle Insurance Policy Verification</h1><p>Enter a policy number to verify the policy details.</p>
<form id="f"><input id="id" placeholder="Policy Number" required><button>Verify Policy</button></form>
<a class="admin" href="admin.html">Admin Login</a>
</div></div>
<script>f.onsubmit=e=>{e.preventDefault();location.href="policy.html?id="+encodeURIComponent(id.value.trim())}</script>
</body></html>
