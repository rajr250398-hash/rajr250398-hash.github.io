<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cattle Insurance Policy Verification</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  color:#333;
}

body{
  overflow-x:hidden;
}

.page{
  width:min(100%,760px);
  margin:0 auto;
  padding:0;
}

.policy-card{
  border-left:1px solid #d8d8d8;
  border-right:1px solid #d8d8d8;
  border-bottom:1px solid #d8d8d8;
  background:#fff;
}

/* Top yellow bar */
.top-bar{
  height:20px;
  background:#ffbf00;
  border-bottom:1px solid #d9a800;
}

/* Company / Logo area */
.brand-area{
  width:100%;
  padding:12px 20px 14px;
  text-align:center;
  background:#fff;
  overflow:hidden;
}

.brand-logo{
  display:block;
  width:100%;
  max-width:720px;
  height:auto;
  margin:0 auto;
  object-fit:contain;
}


/* Policy issuing office */
.office-row{
  display:grid;
  grid-template-columns:38% 62%;
  min-height:108px;
  background:#f7f7d8;
}

.office-row>div{
  padding:22px 14px;
  border-bottom:1px solid #d4d4d4;
}

.label{
  font-weight:700;
  font-size:24px;
  line-height:1.25;
  text-align:center;
  color:#444;
}

.value{
  font-weight:700;
  font-size:24px;
  line-height:1.25;
  display:flex;
  align-items:center;
}

/* Section headings */
.section{
  padding:14px;
  text-align:center;
  font-weight:700;
  font-size:27px;
  border-bottom:1px solid #d4d4d4;
}

.policy-section{
  background:#ffff9b;
}

.customer-section{
  background:#7ed043;
}

/* Policy tables */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

td{
  border-bottom:1px solid #d4d4d4;
  padding:16px 14px;
  vertical-align:middle;
  font-size:23px;
  line-height:1.25;
  overflow-wrap:anywhere;
  word-break:break-word;
}

td:first-child{
  width:38%;
  font-weight:700;
  color:#444;
  background:#f7f7d8;
}

td:last-child{
  width:62%;
  font-weight:700;
}

tr:nth-child(even) td:last-child{
  background:#fff;
}

tr:nth-child(odd) td:last-child{
  background:#f7f7f7;
}

/* Status */
.status-active{
  color:#138a16;
}

.status-inactive{
  color:#b42318;
}

/* Error / loading */
.error{
  padding:35px 20px;
  text-align:center;
  color:#b42318;
  font-size:20px;
}

.loading{
  padding:35px 20px;
  text-align:center;
  color:#666;
}

/* Download button */
.actions{
  padding:18px 15px;
  text-align:center;
  display:flex;
  justify-content:center;
  align-items:center;
}

.actions a{
  display:inline-block;
  padding:12px 18px;
  border:1px solid #138a16;
  border-radius:6px;
  text-decoration:none;
  font-weight:700;
  line-height:1.4;
}

.actions .download{
  background:#138a16;
  color:#fff;
  border-color:#138a16;
  max-width:100%;
}

/* Footer image */
.footer-image{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px 12px 12px;
  background:#fff;
}

.footer-image img{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  object-fit:contain;
}

/* Mobile */
@media(max-width:600px){

  .brand-area{
    padding:10px 8px 12px;
  }

  .brand-logo{
    width:100%;
    max-width:100%;
    height:auto;
  }

  .office-row{
    grid-template-columns:38% 62%;
    min-height:90px;
  }

  .office-row>div{
    padding:16px 8px;
  }

  .label,
  .value{
    font-size:18px;
  }

  .section{
    font-size:21px;
    padding:12px 8px;
  }

  td{
    font-size:17px;
    padding:13px 8px;
  }

  .actions{
    padding:16px 10px;
  }

  .actions .download{
    width:100%;
    max-width:100%;
    padding:13px 12px;
    font-size:16px;
    line-height:1.4;
  }

  .footer-image{
    padding:18px 8px 10px;
  }

  .footer-image img{
    max-width:100%;
  }

}

  .office-row{
    grid-template-columns:38% 62%;
    min-height:90px;
  }

  .office-row>div{
    padding:16px 8px;
  }

  .label,
  .value{
    font-size:18px;
  }

  .section{
    font-size:21px;
    padding:12px 8px;
  }

  td{
    font-size:17px;
    padding:13px 8px;
  }

  td:first-child{
    width:38%;
  }

  td:last-child{
    width:62%;
  }

  .actions{
    padding:16px 10px;
  }

  .actions .download{
    width:100%;
    max-width:100%;
    padding:13px 12px;
    font-size:16px;
    line-height:1.4;
  }

  .footer-image{
    padding:18px 8px 10px;
  }

  .footer-image img{
    max-width:100%;
  }
}

/* Very small phones */
@media(max-width:380px){

  .brand-logo{
    width:160px;
    max-width:65vw;
  }

  .label,
  .value{
    font-size:16px;
  }

  td{
    font-size:15px;
    padding:11px 6px;
  }

  .section{
    font-size:19px;
  }

  .actions .download{
    font-size:15px;
    padding:12px 9px;
  }
}

/* Print */
@media print{

  body{
    background:#fff;
  }

  .page{
    width:100%;
    margin:0;
  }

  .policy-card{
    border:1px solid #aaa;
  }

  .actions{
    display:none;
  }
}
</style>
</head>

<script>

const API="https://cattle-policy-api.rajr250398.workers.dev";

const fields=[
  ["Policy Type","policy_type"],
  ["Policy No.","policy_no"],
  ["Policy Start Date","policy_start_date"],
  ["Policy Expiry Date","policy_expiry_date"],
  ["Sum Insured","sum_insured","money"],
  ["Net Premium","net_premium","money"],
  ["GST Amount","gst_amount","money"],
  ["Total Premium","total_premium","money"],
  ["Mode Of Payment","mode_of_payment"],
  ["Policy Status","policy_status","status"],
  ["Customer Name","customer_name"],
  ["Customer Id","customer_id"],
  ["Mobile No","mobile_no"],
  ["E mail Id","email"],
  ["GST Reg. No.","gst_reg_no"]
];

function esc(x){

  return String(x ?? "").replace(/[&<>"]/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[m]));

}

function displayValue(value,type){

  const s=String(value ?? "").trim();

  if(!s) return "";

  if(type==="money" && !/rs\.?/i.test(s)){
    return "Rs. "+esc(s);
  }

  if(type==="status"){

    const cls=
      /^active$/i.test(s)
        ? "status-active"
        : (
            /^inactive$/i.test(s)
              ? "status-inactive"
              : ""
          );

    return `<span class="${cls}">${esc(s)}</span>`;
  }

  return esc(s);
}

(async()=>{

  try{

    const id=
      new URLSearchParams(location.search)
        .get("id")
        ?.trim();

    if(!id){
      throw new Error("Policy number is missing.");
    }

    const res=await fetch(
      `${API}/api/policy?id=${encodeURIComponent(id)}`
    );

    const data=await res.json();

    if(!res.ok){
      throw new Error(
        data.error || "Policy not found."
      );
    }

    /*
     * Use the policy number returned by the API.
     * If unavailable, use the ID from the URL.
     */
    const policyNumber=
      String(data.policy_no || id).trim();

    let html=`

      <div class="office-row">

        <div class="label">
          Policy Issuing<br>Office
        </div>

        <div class="value">
          ${esc(data.policy_issuing_office || "")}
        </div>

      </div>

      <div class="section policy-section">
        Policy Details
      </div>

      <table>
        <tbody>
    `;

    for(
      const [label,key,type]
      of fields.slice(0,10)
    ){

      html+=`
        <tr>
          <td>${esc(label)}</td>
          <td>${displayValue(data[key],type)}</td>
        </tr>
      `;

    }

    html+=`

        </tbody>
      </table>

      <div class="section customer-section">
        Customer Details
      </div>

      <table>
        <tbody>
    `;

    for(
      const [label,key,type]
      of fields.slice(10)
    ){

      html+=`
        <tr>
          <td>${esc(label)}</td>
          <td>${displayValue(data[key],type)}</td>
        </tr>
      `;

    }

    /*
     * Existing Cloudflare Worker PDF endpoint.
     */
    const pdfUrl=
      `${API}/api/policy-pdf?id=${encodeURIComponent(policyNumber)}`;

    /*
     * Download button.
     * Policy number is inserted automatically.
     */
    html+=`

        </tbody>
      </table>

      <div class="actions">

        <a
          class="download"
          href="${pdfUrl}"
        >
          Click @ Policy ${esc(policyNumber)}
          to download the Policy
        </a>

      </div>

      <!-- =======================================================
           FOOTER IMAGE

           Replace ONLY:
           FOOTER_BASE64_HERE

           IMPORTANT:
           Your footer Base64 starts with:
           iVBORw0KGgo...

           Therefore the correct prefix is:
           data:image/png;base64,

           NOT:
           data:image/jpeg;base64,

           Full format should be:

           data:image/png;base64,iVBORw0KGgo...

           ======================================================= -->
