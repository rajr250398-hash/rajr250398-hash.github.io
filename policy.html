<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy Verification</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#222}.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0001}.head{background:#166534;color:white;padding:25px}.body{padding:22px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee}th{width:38%;color:#667085}.actions{margin-top:20px}button,a{padding:10px 15px;border:1px solid #ccd;border-radius:8px;background:white;text-decoration:none;color:#344054}.err{text-align:center;color:#b42318;padding:35px}
</style></head><body><div class="wrap"><div class="card"><div class="head"><h1>Cattle Insurance Policy Verification</h1><p>Verified policy information</p><b id="status"></b></div><div id="c" class="body">Loading...</div></div></div>
<script>
const API="https://cattle-policy-api.rajr250398.workers.dev";
const fields=[["Policy Issuing Office","policy_issuing_office"],["Policy Type","policy_type"],["Policy No.","policy_no"],["Policy Start Date","policy_start_date"],["Policy Expiry Date","policy_expiry_date"],["Sum Insured","sum_insured"],["Net Premium","net_premium"],["GST Amount","gst_amount"],["Total Premium","total_premium"],["Mode Of Payment","mode_of_payment"],["Policy Status","policy_status"],["Customer Name","customer_name"],["Customer Id","customer_id"],["Mobile No","mobile_no"],["E mail Id","email"],["GST Reg. No.","gst_reg_no"]];
const esc=x=>String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const val=(k,x)=>x==null||String(x).trim()===""?"-":(["sum_insured","net_premium","gst_amount","total_premium"].includes(k)&&!/rs\.?/i.test(String(x))?"Rs. "+esc(x):esc(x));
(async()=>{try{
let id=new URLSearchParams(location.search).get("id")?.trim();if(!id)throw Error("No policy number was provided.");
let r=await fetch(API+"/api/policy?id="+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw Error(d.error||"Policy not found");
status.textContent=d.policy_status||"";
c.innerHTML="<table>"+fields.map(([a,k])=>"<tr><th>"+esc(a)+"</th><td>"+val(k,d[k])+"</td></tr>").join("")+"</table><div class='actions'><button onclick='print()'>Print</button> <a href='index.html'>Verify Another</a></div>";
document.title="Policy "+(d.policy_no||id);
}catch(e){c.innerHTML="<div class='err'><b>Policy not found</b><br><br>"+esc(e.message)+"<br><br><a href='index.html'>Back</a></div>"}})();
</script></body></html>
