<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cattle Insurance Policy Verification</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#333}
.page{width:min(100%,760px);margin:0 auto;padding:0}
.policy-card{border-left:1px solid #d8d8d8;border-right:1px solid #d8d8d8;border-bottom:1px solid #d8d8d8}
.top-bar{height:20px;background:#ffbf00;border-bottom:1px solid #d9a800}
.office-row{display:grid;grid-template-columns:38% 62%;min-height:108px;background:#f7f7d8}
.office-row>div{padding:22px 14px;border-bottom:1px solid #d4d4d4}
.label{font-weight:700;font-size:24px;line-height:1.25;text-align:center;color:#444}
.value{font-weight:700;font-size:24px;line-height:1.25;display:flex;align-items:center}
.section{padding:14px;text-align:center;font-weight:700;font-size:27px;border-bottom:1px solid #d4d4d4}
.policy-section{background:#ffff9b}
.customer-section{background:#7ed043}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{border-bottom:1px solid #d4d4d4;padding:16px 14px;vertical-align:middle;font-size:23px;line-height:1.25}
td:first-child{width:38%;font-weight:700;color:#444;background:#f7f7d8}
td:last-child{width:62%;font-weight:700}
tr:nth-child(even) td:last-child{background:#fff}
tr:nth-child(odd) td:last-child{background:#f7f7f7}
.status-active{color:#138a16}
.status-inactive{color:#b42318}
.error{padding:35px 20px;text-align:center;color:#b42318;font-size:20px}
.loading{padding:35px 20px;text-align:center;color:#666}
.actions{padding:18px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.actions a{display:inline-block;padding:11px 16px;border:1px solid #aaa;border-radius:6px;text-decoration:none;color:#333;background:#fff;font-weight:700}
.actions .download{background:#138a16;color:#fff;border-color:#138a16}
@media(max-width:600px){
  .office-row{grid-template-columns:38% 62%}
  .office-row>div{padding:16px 8px}
  .label,.value{font-size:18px}
  .section{font-size:21px;padding:12px 8px}
  td{font-size:17px;padding:13px 8px}
}
@media print{body{background:#fff}.page{width:100%;margin:0}.policy-card{border:1px solid #aaa}.actions{display:none}}
</style>
</head>
<body>
<div class="page">
  <div class="policy-card">
    <div class="top-bar"></div>
    <div id="content" class="loading">Loading policy...</div>
  </div>
</div>

<script>
const API="https://cattle-policy-api.rajr250398.workers.dev";

const fields=[
  ["Policy Type","policy_type"],
  ["Policy No.","policy_no"],
  ["Policy Start Date","policy_start_date"],
  ["Policy Expiry Date","policy_expiry_date"],
  ["Sum Insured","sum_insured","money"],
  ["Net Premium","net_premium","money"],
  ["GST Amount","gst_amount","money"],
  ["Total Premium","total_premium","money"],
  ["Mode Of Payment","mode_of_payment"],
  ["Policy Status","policy_status","status"],
  ["Customer Name","customer_name"],
  ["Customer Id","customer_id"],
  ["Mobile No","mobile_no"],
  ["E mail Id","email"],
  ["GST Reg. No.","gst_reg_no"]
];

function esc(x){
  return String(x ?? "").replace(/[&<>"]/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
  }[m]));
}

function displayValue(value,type){
  const s=String(value ?? "").trim();
  if(!s) return "";
  if(type==="money" && !/rs\.?/i.test(s)) return "Rs. "+esc(s);
  if(type==="status"){
    const cls=/^active$/i.test(s) ? "status-active" : (/^inactive$/i.test(s) ? "status-inactive" : "");
    return `<span class="${cls}">${esc(s)}</span>`;
  }
  return esc(s);
}

(async()=>{
  try{
    const id=new URLSearchParams(location.search).get("id")?.trim();
    if(!id) throw new Error("Policy number is missing.");

    const res=await fetch(`${API}/api/policy?id=${encodeURIComponent(id)}`);
    const data=await res.json();
    if(!res.ok) throw new Error(data.error || "Policy not found.");

    let html=`
      <div class="office-row">
        <div class="label">Policy Issuing<br>Office</div>
        <div class="value">${esc(data.policy_issuing_office || "")}</div>
      </div>
      <div class="section policy-section">Policy Details</div>
      <table><tbody>`;

    for(const [label,key,type] of fields.slice(0,10)){
      html+=`<tr><td>${esc(label)}</td><td>${displayValue(data[key],type)}</td></tr>`;
    }

    html+=`</tbody></table>
      <div class="section customer-section">Customer Details</div>
      <table><tbody>`;

    for(const [label,key,type] of fields.slice(10)){
      html+=`<tr><td>${esc(label)}</td><td>${displayValue(data[key],type)}</td></tr>`;
    }

    const pdfUrl=`${API}/api/policy-pdf?id=${encodeURIComponent(data.policy_no || id)}`;

    html+=`</tbody></table>
      <div class="actions">
        <a class="download" href="${pdfUrl}">Download Complete Policy PDF</a>
        <a href="index.html">Verify Another Policy</a>
      </div>`;

    document.getElementById("content").outerHTML=html;
    document.title=`Policy ${data.policy_no || id} - Verification`;
  }catch(e){
    document.getElementById("content").outerHTML=
      `<div class="error">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
