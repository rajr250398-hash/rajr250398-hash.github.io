<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>United India Insurance - Policy Details</title>
    <style>
        :root { scroll-behavior: smooth; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 20%;
            background-color: #E8F4FF !important;
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #616161;
        }

        .tdhead1 {
            font-family: Geneva, Verdana, Sans-Serif;
            font-weight: bold;
            font-size: 12px;
            text-align: left;
            color: #616161;
        }

        .label {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 12px;
            color: #616161;
        }

        .tdsubhead {
            font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;
            color: #616161;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        .tdfooter {
            font-family: Geneva, Arial, Helvetica, sans-serif;
            font-weight: 100;
            font-size: 10px;
            text-align: center;
            color: #808080;
        }

        #footer {
            clear: both;
            border-top: 4px solid #FCCE00;
            background-color: #4863A0;
            text-align: center;
            height: 25px;
            font-size: .9em;
            color: #FFFFFF;
            line-height: 25px;
            font-family: Geneva, Arial, Helvetica, sans-serif;
        }

        .header-image {
            width: 100%;
            display: block;
            border-bottom: 4px solid #1a3a7a;
            background-color: #f5c518;
        }

        .header-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .main-container {
            max-width: 952px;
            margin: 0 auto;
            background-color: #f5f0d0;
            border: 1px solid #ADADAD;
            border-radius: 5px;
            box-shadow: 3px 6px 34px -1px rgba(92,145,237,0.64);
            overflow: hidden;
        }

        .content-wrapper {
            background-color: #f5f0d0;
            padding: 50px 60px 30px 60px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            margin-bottom: 0;
            background: transparent;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 10px 8px !important;
            text-align: left;
            font-size: 12px;
            color: #616161;
            font-weight: bold;
            font-family: Verdana, Arial, Helvetica, sans-serif;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        .row-cream .label-cell,
        .row-cream .value-cell {
            background-color: #f5f0d0;
        }

        .row-white .label-cell,
        .row-white .value-cell {
            background-color: #ffffff;
        }

        .label-cell { width: 32%; }
        .value-cell { width: 68%; }

        .section-header-yellow {
            background-color: #ffffcc !important;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: #616161;
            padding: 10px 8px !important;
        }

        .section-header-green {
            background-color: #7cb342 !important;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: #FFFFFF;
            padding: 10px 8px !important;
        }

        .top-yellow-bar {
            background-color: #f5c518;
            height: 22px;
            padding: 0;
        }

        .top-yellow-bar td {
            padding: 0 !important;
            border: none;
        }

        .status-active {
            color: #008000;
            font-weight: bold;
        }

        .status-inactive {
            color: #b00000;
            font-weight: bold;
        }

        .download-btn-container {
            text-align: center;
            margin: 30px 0;
        }

        .download-btn {
            display: inline-block;
            background-color: #f5c518;
            text-align: center;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            font-family: Verdana, Arial, Helvetica, sans-serif;
            cursor: pointer;
            width: 80%;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .download-btn .click-text { color: #555555; }
        .download-btn .at-symbol { color: #FF0000; }
        .download-btn .policy-link { color: #1a3a7a; text-decoration: none; }
        .download-btn .download-text { color: #555555; }

        .download-btn:hover {
            filter: brightness(0.96);
        }

        .download-btn:focus-visible {
            outline: 2px solid #1a3a7a;
            outline-offset: 2px;
        }

        .footer-text {
            text-align: center;
            padding: 20px 0;
            font-size: 11px;
            color: #666;
        }

        .footer-text p { margin: 8px 0; }

        .version-text {
            font-size: 10px;
            color: #888;
        }

        .version-text a { color: red; text-decoration: none; }

        .content-spacer { height: 40px; }
        .divSpacing { padding-bottom: 10px; }

        .loading {
            text-align: center;
            padding: 30px 10px;
            font-size: 12px;
            color: #666;
        }

        .error-box {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #d8aaaa;
            background: #fff4f4;
            color: #a00000;
            text-align: center;
            font-weight: bold;
        }

        /* ==========================================
           MOBILE RESPONSIVE - SAME DESIGN, TIGHTER
           ========================================== */
        @media screen and (max-width: 768px) {
            body {
                padding: 0;
            }

            .main-container {
                max-width: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .content-wrapper {
                padding: 10px 15px 20px 15px !important;
            }

            .content-spacer {
                height: 0 !important;
                display: none !important;
            }

            th, td {
                padding: 8px 6px !important;
                font-size: 12px;
                line-height: 1.3;
            }

            .label-cell { width: 40% !important; }
            .value-cell { width: 60% !important; }

            .section-header-yellow,
            .section-header-green {
                font-size: 13px;
                padding: 8px 6px !important;
            }

            .download-btn-container {
                margin: 20px 0 15px 0;
            }

            .download-btn {
                width: 90%;
                font-size: 15px;
                padding: 12px 10px;
                line-height: 1.4;
            }

            .footer-text {
                padding: 15px 0 10px 0;
            }

            #footer {
                height: auto;
                min-height: 25px;
                line-height: 25px;
                padding: 0 5px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-image">
        <!-- Keep policy-design.png in the same GitHub Pages folder as policy.html -->
        <img src="policy-design.png" alt="United India Insurance Company Ltd.">
    </div>

    <div class="content-wrapper">
        <div id="content" class="loading">Loading policy details...</div>
    </div>
</div>

<script>
    const API = "https://cattle-policy-api.rajr250398.workers.dev";

    const policyFields = [
        ["Policy Type", "policy_type"],
        ["Policy No.", "policy_no"],
        ["Policy Start Date", "policy_start_date"],
        ["Policy Expiry Date", "policy_expiry_date"],
        ["Sum Insured", "sum_insured", "money"],
        ["Net Premium", "net_premium", "money"],
        ["GST Amount", "gst_amount", "money"],
        ["Total Premium", "total_premium", "money"],
        ["Mode Of Payment", "mode_of_payment"],
        ["Policy Status", "policy_status", "status"]
    ];

    const customerFields = [
        ["Customer Name", "customer_name"],
        ["Customer Id", "customer_id"],
        ["Mobile No", "mobile_no"],
        ["E mail Id", "email"],
        ["GST Reg. No", "gst_reg_no"]
    ];

    function esc(value) {
        return String(value ?? "").replace(/[&<>\"]/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;"
            }[char];
        });
    }

    function formatMoney(value) {
        const text = String(value ?? "").trim();
        if (!text) return "";
        if (/^(rs\.?|₹)/i.test(text)) return esc(text);
        return "Rs." + esc(text);
    }

    function formatValue(value, type) {
        const text = String(value ?? "").trim();

        if (type === "money") {
            return formatMoney(text);
        }

        if (type === "status") {
            if (/^active$/i.test(text)) {
                return '<span class="status-active">Active</span>';
            }
            if (/^inactive$/i.test(text)) {
                return '<span class="status-inactive">Inactive</span>';
            }
        }

        return esc(text);
    }

    function buildRows(fields, data, startingClass) {
        let html = "";
        fields.forEach(function (field, index) {
            const label = field[0];
            const key = field[1];
            const type = field[2] || "";
            const rowClass = (index % 2 === 0)
                ? startingClass
                : (startingClass === "row-cream" ? "row-white" : "row-cream");

            html += `
                <tr class="${rowClass}">
                    <td class="label-cell label">${esc(label)}</td>
                    <td class="value-cell tdhead1">${formatValue(data[key], type)}</td>
                </tr>`;
        });
        return html;
    }

    async function loadPolicy() {
        const content = document.getElementById("content");
        const params = new URLSearchParams(window.location.search);
        const id = (params.get("id") || "").trim();

        if (!id) {
            content.innerHTML = '<div class="error-box">Policy number is missing.</div>';
            return;
        }

        try {
            const response = await fetch(
                `${API}/api/policy?id=${encodeURIComponent(id)}`,
                { cache: "no-store" }
            );

            let data = {};
            try {
                data = await response.json();
            } catch (jsonError) {
                throw new Error("Unable to read the policy information.");
            }

            if (!response.ok) {
                throw new Error(data.error || "Policy not found.");
            }

            const policyNumber = String(data.policy_no || id).trim();
            const pdfUrl = `${API}/api/policy-pdf?id=${encodeURIComponent(policyNumber)}`;

            let html = `
                <div class="content-spacer"></div>

                <table aria-label="Policy issuing office">
                    <tbody>
                        <tr>
                            <td colspan="2" class="top-yellow-bar"></td>
                        </tr>
                        <tr class="row-cream">
                            <td class="label-cell label">Policy Issuing Office</td>
                            <td class="value-cell tdhead1">${esc(data.policy_issuing_office || "")}</td>
                        </tr>
                    </tbody>
                </table>

                <table aria-label="Policy details">
                    <tbody>
                        <tr>
                            <th colspan="2" class="section-header-yellow tdsubhead">Policy Details</th>
                        </tr>
                        ${buildRows(policyFields, data, "row-cream")}
                    </tbody>
                </table>

                <table aria-label="Customer details">
                    <tbody>
                        <tr>
                            <th colspan="2" class="section-header-green tdsubhead">Customer Details</th>
                        </tr>
                        ${buildRows(customerFields, data, "row-white")}
                    </tbody>
                </table>

                <div class="download-btn-container divSpacing">
                    <a href="${pdfUrl}" class="download-btn">
                        <span class="click-text">Click </span>
                        <span class="at-symbol">@</span>
                        <span class="policy-link"> Policy ${esc(policyNumber)} </span>
                        <span class="download-text">to download the Policy</span>
                    </a>
                </div>

                <div class="footer-text tdfooter">
                    <p>2010 United India Insurance Company Ltd.</p>
                    <p class="version-text">
                        For Mozilla best viewed in <a href="#">version 3.5</a> and above and For Google Chrome best viewed in <a href="#">version 7.0</a> and above
                    </p>
                </div>

                <div id="footer">
                    Developed &amp; Maintained By TCS
                </div>
            `;

            content.outerHTML = html;
            document.title = `Policy ${policyNumber} - United India Insurance`;
        } catch (error) {
            content.innerHTML = `<div class="error-box">${esc(error.message || "Unable to load policy.")}</div>`;
        }
    }

    loadPolicy();
</script>

</body>
</html>
